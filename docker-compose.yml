version: "3.9"

services:
  # ===========================
  # Backend API (Express + Node)
  # ===========================
  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: gardenly_api
    env_file: .env
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - gardenly-network

  # ===========================
  # Frontend (Vite React + Nginx)
  # ===========================
  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: gardenly_client
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - gardenly-network

networks:
  gardenly-network:
    driver: bridge
