services:
  # ===========================
  # Backend API (Express + Node)
  # ===========================
  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: gardenly_api
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      - redis
      - solr
    restart: unless-stopped
    networks:
      - gardenly-network

  # ===========================
  # Redis (Cache)
  # ===========================
  redis:
    image: redis:latest
    container_name: gardenly_redis
    ports:
      - "6379:6379"
    networks:
      - gardenly-network

  # ===========================
  # Solr (Search)
  # ===========================
  solr:
    image: solr:latest
    container_name: gardenly_solr
    ports:
      - "8983:8983"
    networks:
      - gardenly-network
    command:
      - solr-precreate
      - gardenly

  # ===========================
  # Frontend (Vite React + Nginx)
  # ===========================
  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: gardenly_client
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - gardenly-network

networks:
  gardenly-network:
    driver: bridge
