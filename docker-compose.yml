services:
  # ===========================
  # Backend API (Express + Node)
  # ===========================
  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: gardenly_api
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
      CLIENT_ORIGIN: http://localhost
    ports:
      - "3000:3000"
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - gardenly-network

  # ===========================
  # Redis (Cache)
  # ===========================
  redis:
    image: redis:latest
    container_name: gardenly_redis
    ports:
      - "6379:6379"
    networks:
      - gardenly-network

  # ===========================
  # Frontend (Vite React + Nginx)
  # ===========================
  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: gardenly_client
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - gardenly-network

networks:
  gardenly-network:
    driver: bridge
